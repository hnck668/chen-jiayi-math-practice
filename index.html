<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>陈佳怡-数学错题练习平台</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif;}
body{background:#ffffff;padding:20px;color:#1f2937;max-width:920px;margin:0 auto;}
.page-title{font-size:30px;font-weight:700;margin:12px 0 8px;word-break:break-all;}
.page-subtitle{font-size:16px;color:#444;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #ddd;}
.card{background:#ffffff;border-radius:12px;padding:18px;margin-bottom:16px;border:1px solid #eee;}
.info-text{color:#6b7280;font-size:14px;margin-bottom:12px}
.report-block{background:#eff6ff;padding:14px;border-radius:10px;margin:12px 0}
.weak-tag{background:#fee2e2;color:#dc2626;cursor:pointer;}
.normal-tag{background:#dbeafe;color:#2563eb;cursor:pointer;}
.question-block{margin:20px 0;padding-bottom:16px;border-bottom:1px solid #e5e7eb;}
.q-title{font-weight:bold;font-size:16px;margin-bottom:10px;}
.opt-item{margin:6px 0;padding:6px;cursor:pointer;}
.input-ans{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:16px;margin:8px 0;}
.btn{padding:10px 16px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:15px;margin:4px;cursor:pointer;min-width:120px;}
.btn-sm{padding:4px 8px;font-size:12px;margin:2px;min-width:auto;}
.btn-gray{background:#6b7280}
.btn-green{background:#16a34a}
.btn-orange{background:#f97316}
.btn-red{background:#ef4444}
.analysis{margin-top:10px;padding:10px;background:#f9fafb;border-radius:8px;font-size:14px;color:#444;display:none;}
.score-bar{padding:10px;background:#dbeafe;border-radius:8px;margin-bottom:10px;}
.hide{display:none;}
.tab-wrap{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:10px;border-radius:8px;background:#e2e8f0;cursor:pointer;font-weight:500}
.tab.active{background:#2563eb;color:#fff}
.preview-wrap{position:relative;display:inline-block;}
#preview{max-width:100%;max-height:220px;border-radius:6px;margin:8px 0;}
#canvas{display:none}
.err-item{border-bottom:1px solid #eee;padding:12px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:999;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto;}
.modal-box{width:100%;max-width:600px;background:#fff;border-radius:12px;padding:16px}
.close-modal{float:right;font-size:24px;cursor:pointer;color:#666}
video.player{width:100%;border-radius:8px;margin:8px 0}
.flex-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:12px;margin:2px;}
.report-modal{max-width:520px;}
.del-img-btn{
    position:absolute;
    top:4px;
    right:4px;
    background:#ef4444;
    color:#fff;
    border:none;
    width:26px;
    height:26px;
    border-radius:50%;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>
<body>
<h1 class="page-title">陈佳怡｜数学错题平台</h1>
<div class="page-subtitle">相册上传图片自动识别录入 · 标签分类 · 刷题练习 · 薄弱知识点统计</div>

<div class="tab-wrap">
  <div class="tab active" onclick="switchTab('errbook')">📷 错题录入</div>
  <div class="tab" onclick="switchTab('exam')">📝 刷题练习</div>
  <div class="tab" onclick="switchTab('stat')">📊 薄弱知识点统计</div>
</div>

<!-- ========== 错题录入面板 ========== -->
<div id="errPanel">
<div class="card">
    <div class="info-text">相册选择错题图片，自动识别文字录入题库；识别完成直接入库，无需手动填写</div>
    <button class="btn btn-orange" onclick="clearAllErr()">清空全部错题（不可恢复）</button>
</div>

<div class="card">
  <h3>📷 上传错题图片</h3>
  <div class="flex-row">
    <button class="btn btn-gray" onclick="document.getElementById('fileInput').click()">相册选取图片</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none;">
  </div>
  <div class="preview-wrap">
    <img id="preview"/>
    <button class="del-img-btn" id="delImgBtn" onclick="clearPreview()" style="display:none;">×</button>
  </div>
  <div id="ocrStatus">等待上传图片识别</div>
  <canvas id="canvas"></canvas>
</div>

<div class="card">
  <h3>📚 错题列表</h3>
  <div id="errListWrap"></div>
</div>

<div class="card">
  <h3>💾 备份恢复</h3>
  <button class="btn btn-green" onclick="exportErrJson()">导出题库JSON</button>
  <input type="file" id="importErrFile" accept=".json"/>
  <button class="btn btn-gray" onclick="importErrJson()">导入题库</button>
</div>
</div>

<!-- ========== 刷题面板 ========== -->
<div id="examPanel" class="hide">
<div class="card">
    <div class="score-bar">
        <span>已答：<span id="doneCnt">0</span> / <span id="totalCnt">0</span> &nbsp;&nbsp;答对：<span id="rightCnt">0</span></span>
        <span style="margin-left:12px">用时：<span id="timer">00:00</span></span>
    </div>
    <div class="flex-row">
        <button class="btn" id="startBtn" onclick="startExam()">开始刷题</button>
        <button class="btn btn-orange" id="finishBtn" onclick="showExamReport()" style="display:none;">结束刷题，查看报告</button>
    </div>
    <div class="info-text">按知识点标签筛选，只练习薄弱题型；统计页点击红色薄弱标签可快速进入</div>
    <div id="tagFilterBox" class="flex-row" style="margin-top:10px"></div>
</div>
<div id="paperWrap" class="hide"></div>
</div>

<!-- ========== 统计面板 ========== -->
<div id="statPanel" class="hide">
<div class="card">
  <h3>📊 知识点正确率统计</h3>
  <div class="info-text">正确率低于60%标记为红色薄弱知识点，点击标签直接刷该知识点题目</div>
  <div id="statWrap"></div>
</div>
</div>

<!-- 刷题报告弹窗 -->
<div class="modal" id="reportModal">
  <div class="modal-box report-modal">
    <span class="close-modal" onclick="closeReportModal()">×</span>
    <h4>📝 本次刷题报告</h4>
    <div id="reportContent"></div>
    <div class="flex-row" style="margin-top:12px">
      <button class="btn btn-gray" onclick="closeReportModal()">关闭</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "errbook_chenjiayi_math";
let tempImageDataUrl = "";
let examQuestionList = [];
let currentFilterTag = "";
const previewImg = document.getElementById("preview");
const delImgBtn = document.getElementById("delImgBtn");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// 图片预处理：灰度+二值化，提升OCR识别率
function preprocessImage(imgSrc) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = function () {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                const thresh = 160;
                const val = gray > thresh ? 255 : 0;
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
            }
            ctx.putImageData(imageData, 0, 0);
            resolve(canvas.toDataURL("image/png"));
        }
        img.src = imgSrc;
    })
}

// 清空预览图片
function clearPreview(){
    tempImageDataUrl = "";
    previewImg.src = "";
    delImgBtn.style.display = "none";
    document.getElementById("ocrStatus").innerText = "等待上传图片识别";
}

// 获取错题列表
function getErrList(){
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : [];
}
function saveErrList(list){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

// 清空全部错题
function clearAllErr(){
  if(!confirm("确定清空陈佳怡全部数学错题？无法恢复！")) return;
  localStorage.removeItem(STORAGE_KEY);
  renderErrList();
  alert("✅ 错题库已清空");
}

// 切换标签页
function switchTab(tabName, filterTag=""){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(event && event.target) event.target.classList.add('active');
  document.getElementById('errPanel').classList.add('hide');
  document.getElementById('examPanel').classList.add('hide');
  document.getElementById('statPanel').classList.add('hide');
  currentFilterTag = filterTag;
  if(tabName==='errbook'){
    document.getElementById('errPanel').classList.remove('hide');
  }else if(tabName==='exam'){
    document.getElementById('examPanel').classList.remove('hide');
    examQuestionList = getErrList();
    if(currentFilterTag){
      examQuestionList = examQuestionList.filter(it=>{
        if(!it.tags) return false;
        return it.tags.split(',').some(x=>x.trim()===currentFilterTag);
      })
    }
    document.getElementById("totalCnt").innerText = examQuestionList.length;
    renderTagFilter();
    resetExamUI();
  }else if(tabName==='stat'){
    document.getElementById('statPanel').classList.remove('hide');
    renderStat();
  }
}
function resetExamUI(){
  document.getElementById('startBtn').style.display="block";
  document.getElementById('finishBtn').style.display="none";
  document.getElementById('paperWrap').innerHTML="";
  document.getElementById('paperWrap').classList.add("hide");
  document.getElementById('doneCnt').innerText="0";
  document.getElementById('rightCnt').innerText="0";
  document.getElementById('timer').innerText="00:00";
  if(timerTimer) clearInterval(timerTimer);
}

// 渲染标签筛选
function renderTagFilter(){
  const allTags = new Set();
  const allList = getErrList();
  allList.forEach(it=>{
    if(it.tags){
      it.tags.split(',').map(x=>x.trim()).forEach(t=>allTags.add(t));
    }
  })
  const box = document.getElementById('tagFilterBox');
  box.innerHTML = '<span>标签筛选：</span>';
  Array.from(allTags).forEach(tag=>{
    const btn = document.createElement('button');
    btn.className = 'btn btn-gray btn-sm';
    btn.innerText=tag;
    btn.onclick=()=>filterByTag(tag);
    box.appendChild(btn);
  })
}
function filterByTag(tag){
  examQuestionList = getErrList();
  examQuestionList = examQuestionList.filter(it=>{
    if(!it.tags) return false;
    return it.tags.split(',').some(x=>x.trim()===tag);
  })
  currentFilterTag = tag;
  alert(`筛选标签：${tag}，共${examQuestionList.length}题`);
  document.getElementById("totalCnt").innerText = examQuestionList.length;
  resetExamUI();
}

// 相册图片上传识别、预处理、自动入库
document.getElementById("fileInput").onchange=async e=>{
  const f=e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=async ev=>{
    tempImageDataUrl=ev.target.result;
    previewImg.src=tempImageDataUrl;
    delImgBtn.style.display = "block";
    document.getElementById("ocrStatus").innerText="图片预处理中...";
    const preImg = await preprocessImage(tempImageDataUrl);
    document.getElementById("ocrStatus").innerText="文字识别中...";
    const res=await Tesseract.recognize(preImg,"chi_sim+eng",{
      tessedit_pageseg_mode:Tesseract.PSM.AUTO
    });
    const text = res.data.text.trim();
    if(!text){
        document.getElementById("ocrStatus").innerText="识别失败，没有识别到文字";
        return;
    }
    // 自动生成一条题目，识别文本作为题干
    let list = getErrList();
    list.push({
      question:text,
      answer:"",
      explain:"",
      videoUrl:"",
      tags:"自动录入",
      qtype:"fill",
      options:"",
      img:tempImageDataUrl,
      time:new Date().toLocaleString(),
      rightCount:0,
      wrongCount:0
    });
    saveErrList(list);
    renderErrList();
    document.getElementById("ocrStatus").innerText="✅识别完成，已自动存入题库";
  }
  r.readAsDataURL(f);
}

// 错题列表渲染
function renderErrList(){
  const wrap=document.getElementById("errListWrap");
  wrap.innerHTML="";
  const list = getErrList();
  if(list.length === 0){
    wrap.innerHTML = "<p style='color:#666'>暂无错题，请上传图片录入</p>";
    return;
  }
  list.forEach((it,idx)=>{
    const div=document.createElement('div');
    div.className="err-item";
    let tagHtml = it.tags ? `<div>${it.tags.split(',').map(t=>`<span class="tag normal-tag">${t.trim()}</span>`).join('')}</div>` : '';
    div.innerHTML=`
      <div>${tagHtml}</div>
      <div>${it.question.slice(0,70)}${it.question.length>70?"...":""}</div>
      <div class="flex-row">
        <button class="btn btn-sm" onclick="showErrDetail(${idx})">详情</button>
        <button class="btn btn-sm btn-green" onclick="resetRecord(${idx})">重置记录</button>
        <button class="btn btn-sm btn-gray" onclick="delErr(${idx})">删除</button>
      </div>
    `;
    wrap.appendChild(div);
  })
}
// 重置记录
function resetRecord(i){
  if(!confirm("确定重置这道题的历史对错统计记录？")) return;
  const list=getErrList();
  list[i].rightCount=0;
  list[i].wrongCount=0;
  saveErrList(list);
  renderErrList();
  alert("✅ 记录已重置");
}
function showErrDetail(i){
  const list = getErrList();
  const it=list[i];
  alert(`题干：${it.question}\n标签：${it.tags||''}\n历史：对${it.rightCount} 错${it.wrongCount}`);
}
function delErr(i){
  if(!confirm("确定删除这道错题？"))return;
  let list = getErrList();
  list.splice(i,1);
  saveErrList(list);
  renderErrList();
}
function exportErrJson(){
  const list = getErrList();
  const blob=new Blob([JSON.stringify(list,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download="陈佳怡_数学错题库.json";
  a.click();
  URL.revokeObjectURL(url);
}
function importErrJson(){
  const f=document.getElementById("importErrFile").files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const arr=JSON.parse(ev.target.result);
      let list = getErrList();
      list=[...list,...arr];
      saveErrList(list);
      renderErrList();
      alert("✅ 导入成功");
    }catch(e){alert("❌ JSON格式错误")}
  }
  r.readAsText(f);
}

// 刷题模块
let startTime=null;
let timerTimer=null;
let userAnswers={};
function startExam(){
  if(examQuestionList.length === 0){
    alert("题库为空，请先上传图片录入错题");
    return;
  }
  startTime=Date.now();
  userAnswers={};
  renderPaper();
  document.getElementById('startBtn').style.display='none';
  document.getElementById('finishBtn').style.display='block';
  timerTimer=setInterval(updateTimer,1000);
}
function updateTimer(){
  const s=Math.floor((Date.now()-startTime)/1000);
  const m=String(Math.floor(s/60)).padStart(2,'0');
  const sec=String(s%60).padStart(2,'0');
  document.getElementById('timer').innerText=m+":"+sec;
}
function renderPaper(){
  const wrap=document.getElementById('paperWrap');
  wrap.innerHTML="";
  examQuestionList.forEach((q,idx)=>{
    let html=`<div class="question-block"><div class="q-title">【${q.qtype==='radio'?'单选':'填空'}】${q.question}</div>`;
    if(q.qtype==='radio' && q.options){
      html += `<div style="margin:8px 0;color:#444">${q.options}</div>`;
    }
    html+=`<input class="input-ans" id="inp${idx}" placeholder="填写答案" onchange="fillAns(${idx})">`
    html+=`<div class="analysis" id="an${idx}">参考答案：暂无</div></div>`;
    wrap.innerHTML+=html;
  })
  wrap.classList.remove('hide');
}
function fillAns(qid){
  const v=document.getElementById('inp'+qid).value.trim();
  userAnswers[qid]=v;
  checkStats();
}
function checkStats(){
  let done=0,right=0;
  examQuestionList.forEach((q,idx)=>{
    const ua=userAnswers[idx];
    if(ua!==undefined && ua!==''){
      done++;
      // 因为取消手动录入答案，无法自动判分，只记录作答次数，不判对错
      examQuestionList[idx].wrongCount +=1;
    }
  })
  saveErrList(getErrList());
  document.getElementById('doneCnt').innerText=done;
  document.getElementById('rightCnt').innerText=right;
}

// 刷题报告
function showExamReport(){
  clearInterval(timerTimer);
  let done=0;
  examQuestionList.forEach((q,idx)=>{
    const ua=userAnswers[idx];
    if(ua!==undefined && ua!=='') done++;
  })
  let html = `<p>📌 总题量：${examQuestionList.length}</p>
  <p>✅ 已作答：${done} 题</p>
  <p>提示：当前模式自动图片录入，未录入标准答案，系统不自动判分</p>
  <hr style="margin:10px 0;">`;
  document.getElementById("reportContent").innerHTML = html;
  document.getElementById("reportModal").style.display="flex";
}
function closeReportModal(){
  document.getElementById("reportModal").style.display="none";
}

// 知识点统计页面
function renderStat(){
  const list = getErrList();
  const tagData = {};
  list.forEach(it=>{
    if(!it.tags) return;
    const tags = it.tags.split(',').map(x=>x.trim());
    tags.forEach(t=>{
      if(!tagData[t]) tagData[t]={right:0,total:0};
      tagData[t].right += it.rightCount;
      tagData[t].total += it.rightCount + it.wrongCount;
    })
  })
  const wrap = document.getElementById('statWrap');
  wrap.innerHTML = "";
  for(let t in tagData){
    const d = tagData[t];
    let rate = d.total===0 ? 0 : (d.right/d.total*100).toFixed(1);
    let cls = rate < 60 ? "tag weak-tag" : "tag normal-tag";
    wrap.innerHTML += `<div style="margin:6px 0"><span class="${cls}" onclick="switchTab('exam','${t}')">${t}</span> 作答次数：${d.total}</div>`;
  }
  if(Object.keys(tagData).length===0){
    wrap.innerHTML="<p style='color:#666'>暂无答题记录，刷题后自动生成统计</p>";
  }
}

window.onload = function(){
  renderErrList();
}
</script>
</body>
</html>
